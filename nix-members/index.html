<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Networks connected to NIX</title>
<style>
  :root {
    /* Tune these to NIX branding */
    --fg: #1a1a1a;
    --muted: #666;
    --line: #e2e2e2;
    --head-bg: #f5f6f7;
    --accent: #0b5cad;
    --row-hover: #f0f7ff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: var(--fg);
    background: #fff;
    padding: 0 4px;
  }
  .meta { color: var(--muted); font-size: 13px; margin: 8px 0 16px; }
  .controls { margin: 12px 0; }
  .controls input {
    padding: 7px 10px; border: 1px solid var(--line); border-radius: 6px;
    font-size: 14px; width: 260px; max-width: 100%;
  }
  h2 {
    font-size: 18px; margin: 26px 0 6px; padding-bottom: 4px;
    border-bottom: 2px solid var(--accent);
  }
  h2 .count { font-size: 13px; color: var(--muted); font-weight: normal; }
  table { border-collapse: collapse; width: 100%; margin-bottom: 8px; }
  th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--line); }
  th {
    background: var(--head-bg); font-size: 12px; text-transform: uppercase;
    letter-spacing: .03em; color: var(--muted); cursor: pointer; white-space: nowrap;
  }
  tbody tr:hover { background: var(--row-hover); }
  td.asn, td.ip, td.speed { font-variant-numeric: tabular-nums; white-space: nowrap; }
  td.asn a { color: var(--accent); text-decoration: none; }
  td.asn a:hover { text-decoration: underline; }
  .ip6 { color: var(--muted); }
  #status { padding: 14px; color: var(--muted); }
  #status.error { color: #b00020; }
  .hidden { display: none; }
</style>
</head>
<body>

<div id="status">Loading member list…</div>

<div class="meta hidden" id="meta"></div>
<div class="controls hidden" id="controls">
  <input type="search" id="filter" placeholder="Filter by AS number or name…" autocomplete="off">
</div>

<div id="out"></div>

<script>
// Add the export URLs for every NIX infrastructure here.
// portal.nix.no/.../ixf/1.0 currently serves NIX1 + TIX.
// NIX2 / BIX / SIX / TRDIX are served from their own export URL(s) — add them.
const EXPORTS = [
  "https://portal.nix.no/api/v4/member-export/ixf/1.0"
];

// Optional: only show these exchanges (by shortname). Empty = show all found.
const ONLY = []; // e.g. ["NIX1", "NIX2"]

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function speedLabel(mbps) {
  if (!mbps) return "";
  return mbps >= 1000 ? (mbps / 1000) + "G" : mbps + "M";
}

async function load() {
  let ixpNames = {};   // ixp_id -> shortname
  let rowsByIx = {};   // shortname -> [rows]
  let newest = 0;
  let ok = 0;

  for (const url of EXPORTS) {
    try {
      const r = await fetch(url, { cache: "no-store" });
      if (!r.ok) throw new Error("HTTP " + r.status);
      const d = await r.json();
      ok++;
      if (d.timestamp) newest = Math.max(newest, Date.parse(d.timestamp) || 0);

      for (const ix of (d.ixp_list || [])) ixpNames[ix.ixp_id] = ix.shortname;

      for (const m of (d.member_list || [])) {
        for (const c of (m.connection_list || [])) {
          const sn = ixpNames[c.ixp_id] || ("IXP " + c.ixp_id);
          if (ONLY.length && !ONLY.includes(sn)) continue;
          if (c.state && c.state !== "active" && c.state !== "connected") continue;
          const speed = (c.if_list || []).reduce((a, i) => a + (i.if_speed || 0), 0);
          const v = (c.vlan_list || [])[0] || {};
          (rowsByIx[sn] = rowsByIx[sn] || []).push({
            asnum: m.asnum,
            name: m.name || "",
            ipv4: (v.ipv4 || {}).address || "",
            ipv6: (v.ipv6 || {}).address || "",
            speed
          });
        }
      }
    } catch (e) {
      console.error("Failed to load", url, e);
    }
  }

  if (!ok) {
    const s = $("status");
    s.className = "error";
    s.textContent = "Could not load the member list right now. Please try again later.";
    return;
  }

  $("status").classList.add("hidden");
  $("meta").classList.remove("hidden");
  $("controls").classList.remove("hidden");
  $("meta").textContent = "Source: NIX IX-F Member Export" +
    (newest ? " · updated " + new Date(newest).toISOString().replace("T", " ").replace(/\..*/, " UTC") : "");

  render(rowsByIx);
  $("filter").addEventListener("input", () => applyFilter($("filter").value.trim().toLowerCase()));
}

function render(rowsByIx) {
  const out = $("out");
  out.innerHTML = "";
  const names = Object.keys(rowsByIx).sort();
  for (const sn of names) {
    const rows = rowsByIx[sn].sort((a, b) => a.asnum - b.asnum);
    const sec = document.createElement("section");
    sec.dataset.ix = sn;
    sec.innerHTML =
      '<h2>' + esc(sn) + ' <span class="count">(' + rows.length + ' networks)</span></h2>' +
      '<table><thead><tr>' +
        '<th data-k="asnum">AS</th><th data-k="name">Name</th>' +
        '<th data-k="ipv4">IPv4</th><th data-k="ipv6">IPv6</th>' +
        '<th data-k="speed">Speed</th>' +
      '</tr></thead><tbody>' +
      rows.map(r =>
        '<tr data-s="' + esc((r.asnum + " " + r.name).toLowerCase()) + '">' +
          '<td class="asn"><a href="https://www.peeringdb.com/asn/' + encodeURIComponent(r.asnum) +
            '" target="_blank" rel="noopener">AS' + esc(r.asnum) + '</a></td>' +
          '<td>' + esc(r.name) + '</td>' +
          '<td class="ip">' + esc(r.ipv4) + '</td>' +
          '<td class="ip ip6">' + esc(r.ipv6) + '</td>' +
          '<td class="speed">' + esc(speedLabel(r.speed)) + '</td>' +
        '</tr>'
      ).join("") +
      '</tbody></table>';
    out.appendChild(sec);
  }
}

function applyFilter(q) {
  document.querySelectorAll("#out section").forEach(sec => {
    let shown = 0;
    sec.querySelectorAll("tbody tr").forEach(tr => {
      const hit = !q || tr.dataset.s.includes(q);
      tr.classList.toggle("hidden", !hit);
      if (hit) shown++;
    });
    sec.classList.toggle("hidden", shown === 0);
  });
}

load();
</script>
</body>
</html>
