<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 990 300" font-family="'Segoe UI', system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#7c8698"/>
    </marker>
    <marker id="aht" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#4fc9c0"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="990" height="300" rx="16" fill="#161a24"/>
  <text x="28" y="40" fill="#c7cede" font-size="16" font-weight="600">How sharkbot answers a question</text>

  <!-- User -->
  <rect x="20" y="82" width="160" height="76" rx="12" fill="#222838" stroke="#333a4d"/>
  <rect x="20" y="82" width="160" height="4" rx="2" fill="#7fb4d6"/>
  <text x="100" y="127" fill="#e7ebf3" font-size="16" font-weight="600" text-anchor="middle">User in chat</text>

  <!-- sharkbot -->
  <rect x="290" y="82" width="160" height="76" rx="12" fill="#222838" stroke="#333a4d"/>
  <rect x="290" y="82" width="160" height="4" rx="2" fill="#4fc9c0"/>
  <text x="370" y="127" fill="#e7ebf3" font-size="16" font-weight="600" text-anchor="middle">sharkbot</text>

  <!-- LLM -->
  <rect x="560" y="82" width="160" height="76" rx="12" fill="#222838" stroke="#333a4d"/>
  <rect x="560" y="82" width="160" height="4" rx="2" fill="#9b8cff"/>
  <text x="640" y="120" fill="#e7ebf3" font-size="16" font-weight="600" text-anchor="middle">LLM</text>
  <text x="640" y="140" fill="#9aa3b8" font-size="12" text-anchor="middle">tool-calling</text>

  <!-- APIs -->
  <rect x="810" y="82" width="160" height="76" rx="12" fill="#222838" stroke="#333a4d"/>
  <rect x="810" y="82" width="160" height="4" rx="2" fill="#5fd08a"/>
  <text x="890" y="120" fill="#e7ebf3" font-size="15" font-weight="600" text-anchor="middle">Read-only APIs</text>
  <text x="890" y="140" fill="#9aa3b8" font-size="12" text-anchor="middle">tickets &#183; monitoring</text>

  <!-- forward arrows -->
  <line x1="182" y1="120" x2="286" y2="120" stroke="#7c8698" stroke-width="2" marker-end="url(#ah)"/>
  <text x="234" y="110" fill="#9aa3b8" font-size="12" text-anchor="middle">question</text>

  <line x1="452" y1="120" x2="556" y2="120" stroke="#7c8698" stroke-width="2" marker-end="url(#ah)"/>
  <text x="504" y="110" fill="#9aa3b8" font-size="12" text-anchor="middle">prompt + tools</text>

  <!-- LLM <-> APIs loop -->
  <line x1="722" y1="110" x2="808" y2="110" stroke="#7c8698" stroke-width="2" marker-end="url(#ah)"/>
  <text x="765" y="102" fill="#9aa3b8" font-size="12" text-anchor="middle">tool call</text>
  <line x1="808" y1="132" x2="722" y2="132" stroke="#7c8698" stroke-width="2" marker-end="url(#ah)"/>
  <text x="765" y="150" fill="#9aa3b8" font-size="12" text-anchor="middle">data</text>
  <text x="765" y="182" fill="#6f7889" font-size="11" font-style="italic" text-anchor="middle">loops until answered</text>

  <!-- answer returns to chat -->
  <path d="M640,158 C640,250 210,250 100,160" fill="none" stroke="#4fc9c0" stroke-width="2.5" marker-end="url(#aht)"/>
  <text x="360" y="270" fill="#4fc9c0" font-size="13" text-anchor="middle">final answer, posted to the chat thread</text>
</svg>
