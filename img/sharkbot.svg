<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 300" font-family="'Segoe UI', system-ui, sans-serif">
  <!-- friendly card background -->
  <rect x="0" y="0" width="340" height="300" rx="24" fill="#e8f3fb"/>

  <!-- water bubbles -->
  <circle cx="292" cy="66" r="7" fill="#bfe0f2"/>
  <circle cx="308" cy="92" r="4.5" fill="#bfe0f2"/>
  <circle cx="286" cy="104" r="3" fill="#bfe0f2"/>

  <!-- tail -->
  <path d="M248,150 C275,138 300,116 318,104 C306,148 306,172 318,214 C300,204 275,182 248,174 Z" fill="#5f9ec7"/>

  <!-- dorsal fin -->
  <path d="M128,104 C140,58 176,54 198,100 C174,95 150,99 128,104 Z" fill="#5f9ec7"/>

  <!-- pectoral fin -->
  <path d="M118,198 C116,236 158,230 176,212 C154,206 136,200 118,198 Z" fill="#5f9ec7"/>

  <!-- body -->
  <path d="M58,166 C58,124 110,98 166,100 C216,102 250,124 262,158 C250,194 214,214 165,214 C108,214 58,206 58,166 Z" fill="#7fb4d6"/>

  <!-- belly -->
  <path d="M70,182 C112,212 210,210 254,174 C244,200 208,216 165,216 C110,216 80,206 70,182 Z" fill="#d7ecf9"/>

  <!-- gills -->
  <path d="M158,138 C152,155 152,172 158,188" fill="none" stroke="#5f9ec7" stroke-width="3" stroke-linecap="round"/>
  <path d="M172,140 C166,156 166,172 172,186" fill="none" stroke="#5f9ec7" stroke-width="3" stroke-linecap="round"/>

  <!-- cheek -->
  <ellipse cx="120" cy="182" rx="13" ry="8" fill="#f4a9b8" opacity="0.55"/>

  <!-- smile -->
  <path d="M74,178 C92,196 118,196 134,180" fill="none" stroke="#35505f" stroke-width="4" stroke-linecap="round"/>

  <!-- eye -->
  <circle cx="106" cy="150" r="20" fill="#ffffff"/>
  <circle cx="100" cy="153" r="10" fill="#22303c"/>
  <circle cx="95" cy="148" r="4" fill="#ffffff"/>

  <!-- chat bubble (it speaks) -->
  <rect x="40" y="34" width="86" height="44" rx="13" fill="#ffffff" stroke="#cfe3f2" stroke-width="2"/>
  <path d="M70,76 L86,96 L92,76 Z" fill="#ffffff" stroke="#cfe3f2" stroke-width="2"/>
  <circle cx="63" cy="56" r="4.5" fill="#7fb4d6"/>
  <circle cx="83" cy="56" r="4.5" fill="#7fb4d6"/>
  <circle cx="103" cy="56" r="4.5" fill="#7fb4d6"/>
</svg>
